name: 'METplus Sphinx Linkcheck'
description: 'Run the Sphinx linkcheck builder against a METplus component docs tree'

inputs:
  docs-path:
    description: 'Path to the Sphinx docs directory (containing conf.py)'
    required: false
    default: 'docs'
  requirements-file:
    description: 'Path to a pip requirements file for building the docs'
    required: false
    default: 'docs/requirements.txt'
  python-version:
    description: 'Python version to use. Must be 3.12 or older for repos that pin Sphinx < 6, which imports the imghdr module removed in Python 3.13.'
    required: false
    default: '3.12'
  install-package:
    description: 'If "true", pip install the repository itself (editable) before building docs. Needed for repos whose conf.py imports the package directly (e.g. to read __version__).'
    required: false
    default: 'false'
  fail-on-broken-links:
    description: 'If "true", the action fails when linkcheck reports broken links'
    required: false
    default: 'true'
  recheck-attempts:
    description: 'Number of times to re-check links that fail with a transient error (connection error, timeout, 429, or 5xx). Use 0 to disable re-checks.'
    required: false
    default: '2'
  recheck-delay:
    description: 'Seconds to wait before the first re-check. The wait doubles before each additional re-check.'
    required: false
    default: '15'
  fail-on-transient:
    description: 'If "true", links that still fail with a transient error after all re-checks are reported as errors. If "false", they are reported as warnings instead.'
    required: false
    default: 'true'
  rtd-url:
    description: 'Read the Docs URL with a {version} placeholder (e.g. https://metplus.readthedocs.io/en/{version}/). If set, broken relative links are reported with their Read the Docs URL for the current branch. The URL is shown, not checked.'
    required: false
    default: ''
  check-dois:
    description: 'If "true", check doi.org links with the DOI API (https://doi.org/api/handles/) instead of the publisher site, including links ignored by linkcheck_ignore.'
    required: false
    default: 'true'
  history-branch:
    description: 'Orphan branch of the repository being checked that holds the link check history. Leave empty to disable the history, so that every run decides from its own results.'
    required: false
    default: 'linkcheck-history'
  history-file:
    description: 'Path to the link check history file on the history branch. Several workflows can share one branch by giving each its own file.'
    required: false
    default: 'linkcheck-history.json'
  grace-period:
    description: 'Days a transiently failing link may keep failing before it fails the job. Permanent failures (404, missing anchors, unknown hosts) always fail at once.'
    required: false
    default: '14'
  min-failures:
    description: 'Consecutive failed checks required before a link can fail the job'
    required: false
    default: '2'
  history-retention:
    description: 'Days to keep a history record for a URL that is no longer found in the documentation'
    required: false
    default: '90'
  update-history:
    description: 'If "true", write the history back to the history branch. If "auto", write it for every event except pull_request and pull_request_target. If "false", never write it.'
    required: false
    default: 'auto'
  history-token:
    description: 'Token used to read and write the history branch. The default GITHUB_TOKEN needs "permissions: contents: write" in the calling workflow for the runs that write the history.'
    required: false
    default: ${{ github.token }}
  upload-artifact:
    description: 'If "true", upload the linkcheck output as a workflow artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for the uploaded linkcheck artifact'
    required: false
    default: 'linkcheck-output'

outputs:
  broken-links-found:
    description: '"true" if any links are still broken after re-checks, including transient failures reported as warnings'
    value: ${{ steps.run-linkcheck.outputs.broken_links_found }}

runs:
  using: 'composite'
  steps:
    - name: Check for requirements file
      id: requirements
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        if [ -f "$REQUIREMENTS_FILE" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    # pip caching requires a dependency file to compute the cache key
    - name: Set up Python with pip cache
      if: ${{ steps.requirements.outputs.found == 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: ${{ inputs.requirements-file }}

    - name: Set up Python
      if: ${{ steps.requirements.outputs.found != 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install docs dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ inputs.requirements-file }}" ]; then
          pip install -r "${{ inputs.requirements-file }}"
        else
          pip install sphinx
        fi

    - name: Install repository package
      if: ${{ inputs.install-package == 'true' }}
      shell: bash
      run: pip install -e .

    - name: Read link check history
      id: history
      shell: bash
      env:
        HISTORY_BRANCH: ${{ inputs.history-branch }}
        HISTORY_FILE: ${{ inputs.history-file }}
        HISTORY_TOKEN: ${{ inputs.history-token }}
        HISTORY_WORK: ${{ runner.temp }}/linkcheck-history
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/linkcheck_branch.sh" fetch

    - name: Run linkcheck
      id: run-linkcheck
      shell: bash
      env:
        DOCS_PATH: ${{ inputs.docs-path }}
        FAIL_ON_BROKEN_LINKS: ${{ inputs.fail-on-broken-links }}
        RECHECK_ATTEMPTS: ${{ inputs.recheck-attempts }}
        RECHECK_DELAY: ${{ inputs.recheck-delay }}
        FAIL_ON_TRANSIENT: ${{ inputs.fail-on-transient }}
        RTD_URL: ${{ inputs.rtd-url }}
        CHECK_DOIS: ${{ inputs.check-dois }}
        USE_HISTORY: ${{ steps.history.outputs.enabled }}
        HISTORY_JSON: ${{ steps.history.outputs.path }}
        HISTORY_RESULTS: ${{ runner.temp }}/linkcheck-history/results.json
        HISTORY_BRANCH: ${{ inputs.history-branch }}
        HISTORY_COMMIT: ${{ steps.history.outputs.commit }}
        GRACE_PERIOD: ${{ inputs.grace-period }}
        MIN_FAILURES: ${{ inputs.min-failures }}
        HISTORY_RETENTION: ${{ inputs.history-retention }}
      run: |
        set +e
        cd "$DOCS_PATH"
        sphinx-build -b linkcheck . _build/linkcheck
        status=$?

        # Rename output files to linkcheck-output files if they exist
        if [ -f "_build/linkcheck/output.txt" ]; then
          mv _build/linkcheck/output.txt _build/linkcheck/linkcheck-output.txt
        fi
        if [ -f "_build/linkcheck/output.json" ]; then
          mv _build/linkcheck/output.json _build/linkcheck/linkcheck-output.json
        fi

        cd - > /dev/null

        # sphinx-build exits with 1 for broken links and 2 for other errors
        output_json="$DOCS_PATH/_build/linkcheck/linkcheck-output.json"
        if [ "$status" -gt 1 ] || [ ! -f "$output_json" ]; then
          echo "::error::sphinx-build linkcheck failed with exit status $status"
          echo "broken_links_found=false" >> "$GITHUB_OUTPUT"
          if [ "$FAIL_ON_BROKEN_LINKS" = "true" ]; then
            exit 1
          fi
          exit 0
        fi

        # Decide transient failures from the link check history, if there is one
        history_args=()
        if [ "$USE_HISTORY" = "true" ]; then
          history_args=(--use-history true \
                        --history-file "$HISTORY_JSON" \
                        --history-results "$HISTORY_RESULTS" \
                        --history-branch "$HISTORY_BRANCH" \
                        --history-commit "$HISTORY_COMMIT" \
                        --grace-period "$GRACE_PERIOD" \
                        --min-failures "$MIN_FAILURES" \
                        --history-retention "$HISTORY_RETENTION")
        fi

        # Classify broken links, re-check transient failures, and report results
        python "${{ github.action_path }}/process_linkcheck.py" "$output_json" \
          --docs-path "$DOCS_PATH" \
          --recheck-attempts "$RECHECK_ATTEMPTS" \
          --recheck-delay "$RECHECK_DELAY" \
          --fail-on-transient "$FAIL_ON_TRANSIENT" \
          --fail-on-broken-links "$FAIL_ON_BROKEN_LINKS" \
          --rtd-url "$RTD_URL" \
          --check-dois "$CHECK_DOIS" \
          --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
          ${history_args[@]+"${history_args[@]}"}
        result=$?

        # 2 is a bad input, reported as an error annotation, which fails the
        # step whatever fail-on-broken-links says
        if [ "$result" -eq 2 ]; then
          exit 1
        fi
        if [ "$FAIL_ON_BROKEN_LINKS" = "true" ] && [ "$result" -ne 0 ]; then
          exit 1
        fi
        exit 0

    # written after the links are checked, so that a failing job still records
    # the run that made it fail
    - name: Update link check history
      if: ${{ always() && steps.history.outputs.enabled == 'true'
              && (inputs.update-history == 'true'
                  || (inputs.update-history == 'auto'
                      && github.event_name != 'pull_request'
                      && github.event_name != 'pull_request_target')) }}
      shell: bash
      env:
        HISTORY_BRANCH: ${{ inputs.history-branch }}
        HISTORY_FILE: ${{ inputs.history-file }}
        HISTORY_TOKEN: ${{ inputs.history-token }}
        HISTORY_RETENTION: ${{ inputs.history-retention }}
        HISTORY_WORK: ${{ runner.temp }}/linkcheck-history
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/linkcheck_branch.sh" push

    - name: Upload linkcheck output
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.docs-path }}/_build/linkcheck/linkcheck-output.txt
          ${{ inputs.docs-path }}/_build/linkcheck/linkcheck-output.json